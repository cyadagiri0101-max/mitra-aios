version: '3.9'

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: aios
      POSTGRES_USER: aios_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aios_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios_user -d aios"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aios-network
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c effective_cache_size=1GB

  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aios-network

  ollama:
    image: ollama/ollama:latest
    <<: [*restart, *logging]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aios-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    environment:
      AIOS_MODE: production
      AIOS_LOG_LEVEL: INFO
      AIOS_DATABASE_URL: postgresql://aios_user:${POSTGRES_PASSWORD:-aios_secure_password}@postgres:5432/aios
      AIOS_REDIS_URL: redis://redis:6379/0
      AIOS_OLLAMA_URL: http://ollama:11434
      AIOS_EMBEDDING_PROVIDER: ${AIOS_EMBEDDING_PROVIDER:-ollama}
      AIOS_LLM_PROVIDER: ${AIOS_LLM_PROVIDER:-ollama}
      AIOS_VECTORSTORE_PROVIDER: ${AIOS_VECTORSTORE_PROVIDER:-inmemory}
      AIOS_AUTH_ENABLED: ${AIOS_AUTH_ENABLED:-false}
      AIOS_CORS_ORIGINS: ${AIOS_CORS_ORIGINS:-*}
    volumes:
      - ./.ai:/app/.ai
      - backend-logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aios-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./mitra-frontend
      dockerfile: Dockerfile
    <<: [*restart, *logging]
    environment:
      VITE_API_URL: http://localhost/api
      VITE_WS_URL: ws://localhost/api/v1/ws
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - aios-network

  nginx:
    image: nginx:alpine
    <<: [*restart, *logging]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mitra-frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aios-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  ollama-data:
    driver: local
  backend-logs:
    driver: local

networks:
  aios-network:
    driver: bridge
