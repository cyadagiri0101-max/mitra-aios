name: Release Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"
  DB_NAME: mitra_v2_test
  DB_USERNAME: mitra_admin
  DB_PASSWORD: mitra_admin
  DB_HOST: localhost
  DB_PORT: 5432
  JWT_SECRET: ci-jwt-secret-do-not-use-in-prod
  SEED_ADMIN_PASSWORD: E2eAdminPass!2026

jobs:
  release-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mitra_admin
          POSTGRES_PASSWORD: mitra_admin
          POSTGRES_DB: mitra_v2_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # ── Python AIOS ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint (Python)
        run: ruff check src/
      - name: Run Python tests
        run: |
          pytest tests/ \
            --cov=aios --cov-report=term \
            --cov-fail-under=80 \
            --ignore=tests/test_scheduler.py \
            -q --tb=short

      # ── NestJS Backend ─────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mitra-backend/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: mitra-backend
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build backend
        run: npm run build
        working-directory: mitra-backend
      - name: Run backend unit tests
        run: npm test -- --passWithNoTests
        working-directory: mitra-backend
      - name: Run migrations
        run: |
          npm run migration:run
        working-directory: mitra-backend
        env:
          DB_NAME: mitra_v2_test
          DB_USERNAME: mitra_admin
          DB_PASSWORD: mitra_admin
      - name: Seed reference data
        run: node dist/database/seed.js
        working-directory: mitra-backend
        env:
          DB_NAME: mitra_v2_test
          DB_USERNAME: mitra_admin
          DB_PASSWORD: mitra_admin
          SEED_ADMIN_PASSWORD: E2eAdminPass!2026
      - name: Start backend server
        run: |
          node dist/main.js &
          sleep 5
          curl -sf http://localhost:3001/api/health || exit 1
        working-directory: mitra-backend
        env:
          DB_NAME: mitra_v2_test
          DB_USERNAME: mitra_admin
          DB_PASSWORD: mitra_admin
          NODE_ENV: test
      - name: Run backend E2E tests
        run: npm run test:e2e
        working-directory: mitra-backend
        env:
          DB_NAME: mitra_v2_test
          DB_USERNAME: mitra_admin
          DB_PASSWORD: mitra_admin
          SEED_ADMIN_PASSWORD: E2eAdminPass!2026
      - name: Workflow certification probe
        run: python scripts/workflow_certification_probe.py
        env:
          DB_NAME: mitra_v2_test
          DB_USERNAME: mitra_admin
          DB_PASSWORD: mitra_admin

      # ── React Frontend ──────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mitra-frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: mitra-frontend
      - name: Build frontend
        run: npm run build
        working-directory: mitra-frontend
