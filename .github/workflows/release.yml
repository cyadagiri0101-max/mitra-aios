name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aios

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ pypi-AgEIcHlwaS5vcmcCJDYzYzgxYjYzLTU1NTktNDI2Zi05ZDZkLTE3MzVmMTIwYTU1ZgACKlszLCJhOWQwZjM4OC1hYjFiLTQ2MmYtYmZmMC0yNTQ1ZDY0NmMxYzkiXQAABiC4dYBnZno4VQS8OSfVOb7MWx5eLL7W-jdmr1ckJB95Tg }}
          skip-existing: true

  github-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
