[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aios"
version = "1.2.0-rc2"
description = "MITRA AIOS — AI Operating System runtime (v1.2.0-rc2 EOS Convergence)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "typer>=0.9.0,<1.0",
  "fastapi>=0.110.0,<1.0",
  "pydantic>=2.0,<3.0",
  "uvicorn>=0.27.0,<1.0",
  "websockets>=12.0,<14.0",
]

[project.scripts]
aios = "aios.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "types-PyYAML>=6.0,<7.0",
  "httpx2>=0.1.0",
  "ruff>=0.3.0,<1.0",
  "pytest-asyncio>=0.23.0,<1.0",
  "pytest-cov>=4.0,<6.0",
  "httpx>=0.27.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=aios --cov-report=term --cov-fail-under=80 --ignore=tests/test_scheduler.py -k 'not TestRealRepo'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "N806", "N817"]
